name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest

    - name: Detect problematic filenames (spaces, #, non-ASCII)
      run: |
        python - <<'PY'
import sys, os, subprocess
files = subprocess.check_output(['git','ls-files']).decode().splitlines()
bad = []
for f in files:
    if ' ' in f or '#' in f:
        bad.append(f + '  <-- contains space or #')
    if any(ord(c) > 127 for c in f):
        bad.append(f + '  <-- contains non-ASCII characters')
if bad:
    print('Found problematic filenames:')
    print('\n'.join(bad))
    sys.exit(1)
else:
    print('No problematic filenames found')
PY

    - name: Lint (flake8)
      run: |
        # only lint src if it exists
        if [ -d src ]; then
          flake8 src || exit 1
        else
          echo "No src/ directory to lint, skipping flake8"
        fi

    - name: Run tests (pytest)
      run: |
        if ls test* 1> /dev/null 2>&1 || [ -d tests ]; then
          pytest -q
        else
          echo "No tests found, skipping pytest"
        fi
